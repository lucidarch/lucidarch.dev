{{ "<!-- navigation -->" | safeHTML }}
<header class="l-site-nav navigation" role="banner">
  <div class="l-snav-inner">
    <a href="{{ site.BaseURL }}" class="l-snav-logo" aria-label="{{ site.Title }}">
      <svg width="26" height="26" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="snav-g" x1="32" y1="20" x2="224" y2="212" gradientUnits="userSpaceOnUse">
            <stop offset="0%"   stop-color="#F49AC2"/>
            <stop offset="35%"  stop-color="#B84DFF"/>
            <stop offset="70%"  stop-color="#7C3AED"/>
            <stop offset="100%" stop-color="#2E1065"/>
          </linearGradient>
        </defs>
        <rect x="32"  y="20"  width="56" height="56"  rx="10" fill="url(#snav-g)"/>
        <rect x="100" y="20"  width="56" height="56"  rx="10" fill="url(#snav-g)"/>
        <rect x="32"  y="88"  width="56" height="124" rx="10" fill="url(#snav-g)"/>
        <rect x="100" y="88"  width="56" height="56"  rx="10" fill="url(#snav-g)"/>
        <rect x="168" y="88"  width="56" height="56"  rx="10" fill="url(#snav-g)"/>
        <rect x="100" y="156" width="56" height="56"  rx="10" fill="url(#snav-g)"/>
        <rect x="168" y="156" width="56" height="56"  rx="10" fill="url(#snav-g)"/>
      </svg>
      <div class="l-snav-logo-text">
        lucid
        <span>architecture</span>
      </div>
    </a>
    <ul class="l-snav-links" role="list">
      {{ range site.Menus.main }}
      <li><a href="{{ .URL | absURL }}">{{ .Name }}</a></li>
      {{ end }}
    </ul>
    {{ if site.Params.navigation_button.enable }}
    {{ with site.Params.navigation_button }}
    <a href="{{ .link | absURL }}" class="l-snav-cta">{{ .label }}</a>
    {{ end }}
    {{ end }}
  </div>
</header>
{{ "<!-- /navigation -->" | safeHTML }}
